backend:
  name: github
  repo: TangledWiresOfficial/tangledwires.co.uk
  branch: main
  base_url: https://decap-proxy.tangledwires.co.uk

media_folder: public/content_media
public_folder: /content_media
publish_mode: editorial_workflow
site_url: https://tangledwires.co.uk

collections:
  - name: 'articles'
    label: 'Articles'
    folder: 'content/articles'
    extension: 'mdx'
    format: 'frontmatter'
    create: true
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    preview_path: articles/{{slug}}
    editor:
      preview: false
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime' }
      - { label: 'Description', name: 'description', widget: 'string' }
      - { label: 'Author', name: 'author', widget: 'string' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
